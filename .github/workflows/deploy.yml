name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghrc.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: COMMIT=${{ github.sha }}
          tags: |
            ghrc.io/appsono/sono-website:latest
            ghrc.io/appsono/sono-website:${{ github.sha }}

      - name: Trigger portainer redeploy
        run: curl -fsSk -X POST "$WEBHOOK_URL"
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
